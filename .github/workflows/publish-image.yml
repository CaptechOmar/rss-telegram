name: Publish Docker image

# Builds docker/Dockerfile and publishes it to GitHub Container Registry:
#   ghcr.io/captechomar/rss-telegram:latest   (every push to main)
#   ghcr.io/captechomar/rss-telegram:sha-xxxxxxx
#   ghcr.io/captechomar/rss-telegram:1.2.3    (when you push a tag like v1.2.3)
# Uses the built-in GITHUB_TOKEN, so no secrets need to be set up.

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # The action lower-cases this, which GHCR requires.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
